name: Build APK

# Every push to main builds a test APK (kept as a download on the run page).
# To publish a version: Actions > Build APK > Run workflow, type the version
# (e.g. 1.0.0). The signed APK goes on the Releases page, where the app's
# "Check for updates" finds it. Pushing a tag like v1.0.0 does the same.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.0 (leave empty for a test build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "VERSION_NAME=${INPUT_VERSION#v}" >> "$GITHUB_ENV"
            echo "RELEASE=true" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.${GITHUB_RUN_NUMBER}-dev" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Load signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          elif [ "$RELEASE" = "true" ]; then
            echo "::error title=Signing key missing::Add the SIGNING_KEY secret before publishing a release."
            exit 1
          fi

      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Could not|Unresolved|> " build.log | head -60 \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::${msg}"
          fi

      - name: Name APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/WallpaperStudio-v${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: WallpaperStudio-v${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: Publish release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Wallpaper Studio v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          body_path: release-notes.md
