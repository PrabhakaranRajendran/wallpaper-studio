name: UI test

# Runs on pushes whose commit message contains "[test]": builds the test APK,
# starts an Android emulator, takes screenshots of every screen and of the
# wallpaper itself, and saves them to the "screens" branch for review.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ui:
    if: contains(github.event.head_commit.message, '[test]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build test APK
        run: |
          set -o pipefail
          mkdir -p shots
          gradle assembleDebug --no-daemon 2>&1 | tee shots/build.log

      - name: Tools for test media
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/screens.sh

      - name: Save screenshots to the "screens" branch
        if: always()
        run: |
          mkdir -p shots
          cd shots
          git init -q
          git checkout -q -b screens
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "Screens for ${GITHUB_SHA::7}" || true
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screens
